name: Daily Auto-Scrape
on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 httpx lxml playwright
          npm ci
          npx playwright install chromium --with-deps

      - name: Install security/recon tools (Go)
        run: |
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/naabu/v2/cmd/naabu@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/OJ/gobuster/v3@latest
          go install github.com/ffuf/ffuf/v2@latest
          nuclei -update-templates

      - name: Scrape all data sources
        run: python3 scripts/scrape-all.py

      - name: Scrape promos
        run: python3 scripts/scrape-promos.py

      - name: Check service statuses
        run: python3 scripts/scrape-status.py

      - name: Scrape gold, crypto, earthquakes
        run: python3 scripts/scrape-prices.py

      - name: Security audit of scrape sources (nuclei)
        run: |
          export PATH="$HOME/go/bin:$PATH"
          python3 scripts/security/check_sources.py --skip-nikto

      - name: Reliability-aware scrape (pre-check sources)
        run: |
          python3 scripts/scrape-all.py --reliability || true

      - name: Expand free-software directory (legit alternatives)
        run: python3 scripts/security/expand_free_software.py

      - name: Build
        run: npm run build

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ scripts/security/recon-out/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: auto-update all scraped data [skip ci]"
            git push
          fi
