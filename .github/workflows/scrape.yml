name: Daily Auto-Scrape
on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 httpx lxml playwright
          npm ci
          npx playwright install chromium --with-deps

      - name: Scrape all data sources
        run: python3 scripts/scrape-all.py

      - name: Scrape promos
        run: python3 scripts/scrape-promos.py

      - name: Check service statuses
        run: python3 scripts/scrape-status.py

      - name: Scrape gold, crypto, earthquakes
        run: python3 scripts/scrape-prices.py

      - name: Build
        run: npm run build

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ dist/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: auto-update all scraped data [skip ci]"
            git push
          fi
